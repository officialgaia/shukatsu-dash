# Cloudflare Workers の設定。秘密情報はここに書かない（wrangler secret put を使う）。
name = "shukatsu-dash"
main = "src/index.js"
compatibility_date = "2026-11-01"

# CORS で許可するオリジン（カンマ区切り）。GitHub Pages のオリジンは
# https://<ユーザー名>.github.io （リポジトリ名のパスは付けない）
[vars]
ALLOWED_ORIGINS = "https://YOUR-GITHUB-USERNAME.github.io"
# AIコーチ（M3）
COACH_MODEL = "claude-sonnet-5-5"   # モデルを変えるときはここ
COACH_EFFORT = "low"                # low | medium | high（高いほど丁寧だが高くつく）
COACH_MAX_TURNS = "10"              # 1回の振り返りで送れる回数の上限
COACH_DAILY_LIMIT = "3"             # 1日に始められる振り返りの回数
# プッシュ通知（M4）
VAPID_PUBLIC_KEY = ""               # npm run vapid で作った PUBLIC を貼る（秘密ではない）
VAPID_SUBJECT = "https://YOUR-GITHUB-USERNAME.github.io"   # 送信元の連絡先（公開 URL か mailto:）
PLAN_URL = "https://YOUR-GITHUB-USERNAME.github.io/YOUR-REPO/data/plan.json"  # 通知の文面に使う

# 通知の時刻を見るため15分ごとに起動する（Cron は UTC だが、日本時間の判定はコード側でしている）
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "shukatsu-dash"
# `npx wrangler d1 create shukatsu-dash` で表示された ID に置き換える
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# secret（wrangler secret put で設定。リポジトリには入れない）
#   ACCESS_TOKEN      … アプリに入力する長いランダムな文字列（M2）
#   ANTHROPIC_API_KEY … Claude API のキー（M3）
#   VAPID_PRIVATE_KEY … プッシュ通知の秘密鍵（M4）
